# Deploy from repo root:
#   fly deploy --remote-only --config apps/worker/fly.toml
#
# Keep at least one Machine running — workers should not autostop.

app = "tadading-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "apps/worker/Dockerfile"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "worker"
  PORT = "3002"
  BRAND_NAME = "TadaDing"
  PUBLIC_DOMAIN = "tadading-web.fly.dev"
  SOCIAL_HANDLE = "playtadading"
  TAGLINE = "Your daily tiny win."
  WEB_ORIGIN = "https://tadading-web.fly.dev"
  API_ORIGIN = "https://tadading-api.fly.dev"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health/live"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
