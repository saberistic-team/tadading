# Deploy from repo root:
#   fly deploy --remote-only --config apps/api/fly.toml
#
# App name must match `fly apps create`. Change primary_region as needed.

app = "tadading-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  SERVICE_NAME = "api"
  PORT = "3001"
  BRAND_NAME = "TadaDing"
  PUBLIC_DOMAIN = "tadading-web.fly.dev"
  SOCIAL_HANDLE = "playtadading"
  TAGLINE = "Your daily tiny win."
  WEB_ORIGIN = "https://tadading-web.fly.dev"
  API_ORIGIN = "https://tadading-api.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health/ready"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
