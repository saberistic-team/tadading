# Managed-data production profile for Phase 0.
# Strict self-hosted Postgres/Redis containers are documented in docs/operations.md.
# Use paid instance plans so preDeployCommand is available (not supported on free).

previewsEnabled: true
previewsExpireAfterDays: 3

databases:
  - name: tadading-postgres
    plan: basic-256mb
    databaseName: tadading
    user: tadading
    postgresMajorVersion: "16"

services:
  - type: redis
    name: tadading-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: tadading-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    preDeployCommand: node packages/db/dist/migrate-cli.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: "3001"
      - key: BRAND_NAME
        sync: false
      - key: PUBLIC_DOMAIN
        sync: false
      - key: SOCIAL_HANDLE
        sync: false
      - key: TAGLINE
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tadading-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tadading-redis
          type: redis
          property: connectionString

  - type: web
    name: tadading-web
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BRAND_NAME
        sync: false
      - key: PUBLIC_DOMAIN
        sync: false
      - key: SOCIAL_HANDLE
        sync: false
      - key: TAGLINE
        sync: false
      - key: NEXT_PUBLIC_API_ORIGIN
        sync: false

  - type: worker
    name: tadading-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: PORT
        value: "3002"
      - key: BRAND_NAME
        sync: false
      - key: PUBLIC_DOMAIN
        sync: false
      - key: SOCIAL_HANDLE
        sync: false
      - key: TAGLINE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tadading-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tadading-redis
          type: redis
          property: connectionString
