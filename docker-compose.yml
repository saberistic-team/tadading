name: tadading

x-app-env: &app-env
  BRAND_NAME: ${BRAND_NAME:-TadaDing}
  PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
  SOCIAL_HANDLE: ${SOCIAL_HANDLE:-playtadading}
  TAGLINE: "${TAGLINE:-Your daily tiny win.}"
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
  API_ORIGIN: ${API_ORIGIN:-http://localhost:3101}
  NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:3101}
  WORKER_ORIGIN: ${WORKER_ORIGIN:-http://localhost:3102}
  DATABASE_URL: postgres://tadading:tadading@postgres:5432/tadading
  REDIS_URL: redis://redis:6379
  NODE_ENV: ${NODE_ENV:-production}
  PUZZLE_SEED_SECRET: ${PUZZLE_SEED_SECRET:-dev-puzzle-seed-secret-change-me}
  GUEST_HMAC_SECRET: ${GUEST_HMAC_SECRET:-dev-guest-hmac-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tadading
      POSTGRES_PASSWORD: tadading
      POSTGRES_DB: tadading
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadading -d tadading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: tadading
      POSTGRES_PWD: tadading
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7234:7233"
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3100
    ports:
      - "8088:8080"

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"
      - "8025:8025"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8890:8889"

  prometheus:
    image: prom/prometheus:v3.4.2
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3103:3000"
    depends_on:
      - prometheus

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      SERVICE_NAME: api
      PORT: "3001"
    ports:
      - "3101:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      PORT: "3002"
    ports:
      - "3102:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BRAND_NAME: ${BRAND_NAME:-TadaDing}
        PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
        SOCIAL_HANDLE: ${SOCIAL_HANDLE:-playtadading}
        TAGLINE: "${TAGLINE:-Your daily tiny win.}"
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-http://localhost:3101}
    environment:
      <<: *app-env
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3100:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
