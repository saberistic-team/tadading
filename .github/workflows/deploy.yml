name: deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-fly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    environment: fly-preview
    steps:
      - uses: actions/checkout@v4

      - name: Check Fly configuration
        id: config
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_API_HEALTH_URL: ${{ secrets.FLY_API_HEALTH_URL }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fly deploy skipped — add FLY_API_TOKEN (and optionally FLY_API_HEALTH_URL) to the fly-preview GitHub Environment."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "$FLY_API_HEALTH_URL" ]; then
            echo "health_url=$FLY_API_HEALTH_URL" >> "$GITHUB_OUTPUT"
          else
            echo "health_url=https://tadading-api.fly.dev/health/ready" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.config.outputs.configured == 'true'

      - name: Deploy API
        if: steps.config.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config apps/api/fly.toml

      - name: Deploy worker
        if: steps.config.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config apps/worker/fly.toml

      - name: Deploy web
        if: steps.config.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config apps/web/fly.toml

      - name: Wait for API health
        if: steps.config.outputs.configured == 'true'
        env:
          FLY_API_HEALTH_URL: ${{ steps.config.outputs.health_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS "$FLY_API_HEALTH_URL" | tee /tmp/fly-ready.json; then
              node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/fly-ready.json','utf8')); if(b.status!=='ready') process.exit(2);"
              echo "Fly API is ready"
              exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 10
          done
          echo "Timed out waiting for Fly health"
          exit 1

      - name: Comment deploy status on PR
        if: steps.config.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          FLY_API_HEALTH_URL: ${{ steps.config.outputs.health_url }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const health = process.env.FLY_API_HEALTH_URL;
            const body = [
              '## Fly.io deploy',
              '',
              `- Commit: \`${sha}\``,
              `- Health: ${health}`,
              `- Status: ready check completed`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
