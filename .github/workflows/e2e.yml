name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tadading
          POSTGRES_PASSWORD: tadading
          POSTGRES_DB: tadading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tadading -d tadading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tadading:tadading@localhost:5432/tadading
      REDIS_URL: redis://localhost:6379
      BRAND_NAME: TadaDing
      PUBLIC_DOMAIN: localhost
      SOCIAL_HANDLE: playtadading
      TAGLINE: Your daily tiny win.
      WEB_ORIGIN: http://127.0.0.1:3100
      API_ORIGIN: http://127.0.0.1:3101
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:3101
      NODE_ENV: production
      PUZZLE_SEED_SECRET: ci-puzzle-seed
      GUEST_HMAC_SECRET: ci-guest-hmac
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @tadading/web exec playwright install --with-deps chromium

      - name: Start API and web
        run: |
          SERVICE_NAME=api PORT=3101 pnpm --filter @tadading/api start &
          PORT=3100 pnpm --filter @tadading/web start &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3101/health/ready >/dev/null && \
            curl -fsS http://localhost:3100 >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
